spring.application.name=order-service
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/orders_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# Usuario: Busca 'MYSQLUSER', si no, usa 'root'
spring.datasource.username=${MYSQLUSER:root}

# Contraseña: Busca 'MYSQLPASSWORD', si no, usa 'root'
spring.datasource.password=${MYSQLPASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false




