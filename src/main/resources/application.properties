spring.application.name=order-service
server.port=8081

# Base de Datos
spring.datasource.url=jdbc:mysql://localhost:3306/orders_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Usuario: Busca 'MYSQLUSER', si no, usa 'root'
spring.datasource.username=${MYSQLUSER:root}

# Password: Busca 'MYSQLPASSWORD', si no, usa 'root'
spring.datasource.password=${MYSQLPASSWORD:root}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---- CONFIGURACION EUREKA -------#
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

# ---- CONFIGURACION ACTUATOR -------#
# Nota: He borrado la linea de 'exclude=*' porque choca con la de abajo
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Habilitar el endpoint info
management.endpoint.info.enabled=true
management.info.env.enabled=true

# ---- INFORMACION MANUAL (Para que no salga vacio) ----
info.app.name=Order Service
info.app.description=Microservicio de Ordenes
info.app.version=1.0.0

# ---- Reglas del Circuit Breaker ----
# Configuración para ver el estado del Circuit Breaker (Actuator)
management.health.circuitbreakers.enabled=true


# Reglas del Circuit Breaker
resilience4j.circuitbreaker.instances.inventory.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.inventory.eventConsumerBufferSize=10
resilience4j.circuitbreaker.instances.inventory.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.inventory.slidingWindowSize=5
resilience4j.circuitbreaker.instances.inventory.failureRateThreshold=50
resilience4j.circuitbreaker.instances.inventory.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.inventory.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.inventory.automaticTransitionFromOpenToHalfOpenEnabled=true


